name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4']
        stability: [prefer-stable]

    name: PHP ${{ matrix.php }} — ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: pcov

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/pest --compact

  canvas:
    runs-on: ubuntu-latest
    name: Flow canvas (JS)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships Node; no setup action needed.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check the committed bundle matches the source
        run: |
          npm run build
          git diff --exit-code -- resources/dist || (echo "resources/dist is stale: run 'npm run build' and commit it." && exit 1)
